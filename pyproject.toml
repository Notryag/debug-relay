[project]
name = "debugrelay"
version = "0.0.0"
description = "AI-native debugging context and verified resolution system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema[format]>=4.23.0,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

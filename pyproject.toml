[project]
name = "debugrelay"
version = "0.1.0"
description = "AI-native debugging context and verified resolution system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi[standard]>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema[format]>=4.23.0,<5.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "structlog>=25.0.0,<26.0.0",
    "typer>=0.16.0,<1.0.0",
]

[project.scripts]
debugrelay = "debugrelay.cli:app"
debugrelay-api = "debugrelay.main:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

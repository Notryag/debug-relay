services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${DEBUGRELAY_API_MEMORY_LIMIT:-192m}
    memswap_limit: ${DEBUGRELAY_API_MEMORY_SWAP_LIMIT:-192m}
    pids_limit: ${DEBUGRELAY_API_PIDS_LIMIT:-64}
    environment:
      DEBUGRELAY_ENV: ${DEBUGRELAY_ENV:-local}
      DEBUGRELAY_ADMIN_TOKEN: ${DEBUGRELAY_ADMIN_TOKEN:-debugrelay-local-admin}
      DEBUGRELAY_MAX_EVENT_BYTES: ${DEBUGRELAY_MAX_EVENT_BYTES:-262144}
      DATABASE_URL: ${DEBUGRELAY_DOCKER_DATABASE_URL:-postgresql+asyncpg://debugrelay:debugrelay@platform-postgres:5432/debugrelay}
    networks:
      - shared-postgres
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')",
        ]
      interval: 1h
      start_interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  shared-postgres:
    name: ${DEBUGRELAY_POSTGRES_NETWORK:-platform-infra}
    external: true
